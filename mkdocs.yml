site_name: XML · Apuntes
site_description: Apuntes de XML siguiendo la estructura de la UD 1 (primer programa).
site_url: https://apuntes-dam.github.io/xml-apuntes/
repo_url: https://github.com/apuntes-dam/xml-apuntes
repo_name: GitHub
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
extra_css:
  - assets/extra.css
  - assets/lenguajes.css?v=c962f668
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/apuntes-dam/
      name: Síguenos en GitHub
copyright: Practica los Lenguajes de Programación para 1º DAM y 2º DAM · <a href="https://github.com/apuntes-dam/">Síguenos en GitHub</a>
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Inicio: index.md
  - Mapa de unidades: unidades.md
  - "U1 · Documentos XML":
      - u01/index.md
      - "1.1 Qué es XML": u01/01-que-es.md
      - "1.2 La estructura de un documento": u01/02-estructura.md
      - "1.3 Buen formado y errores típicos": u01/03-buen-formado.md
      - "1.4 Espacios de nombres": u01/04-espacios.md
      - "1.5 Herramientas": u01/05-herramientas.md
      - "Prácticas": u01/practicas.md
      - "Ejercicios de la unidad 1": u01/ejercicios.md
  - "U2 · Validación":
      - u02/index.md
      - "2.1 Bien formado y válido": u02/01-valido.md
      - "2.2 DTD": u02/02-dtd.md
      - "2.3 XML Schema (XSD)": u02/03-xsd.md
      - "2.4 DTD frente a XSD": u02/04-comparar.md
      - "Ejercicios de la unidad 2": u02/ejercicios.md
  - "U3 · Consultar y transformar":
      - u03/index.md
      - "3.1 XPath": u03/01-xpath.md
      - "3.2 XSLT": u03/02-xslt.md
      - "3.3 XML desde un programa": u03/03-programas.md
      - "Ejercicios de la unidad 3": u03/ejercicios.md
  - "U4 · XML en la práctica":
      - u04/index.md
      - "4.1 XML y JSON": u04/01-json.md
      - "4.2 SAX: analizar sin cargar todo el árbol": u04/02-sax.md
      - "4.3 Consultar documentos con espacios de nombres": u04/03-namespaces-xpath.md
      - "Ejercicios de la unidad 4": u04/ejercicios.md
